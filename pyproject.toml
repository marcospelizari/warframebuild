[project]
name = "warframebuild"
version = "0.1.0.dev0"
description = "Free, non-commercial build optimizer for Warframe primary and secondary weapons."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn>=0.32",
]

[project.scripts]
wfb = "app.data.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
